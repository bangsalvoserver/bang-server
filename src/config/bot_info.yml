bots:
  propic_size: 512
  
  settings:
    # Attempts are made in rounds: every action is tried once per round.
    # An action that has a negative score, needs a prompt or returns an error
    # is regenerated with new random targets and tried again in the next round.
    # max_retries: number of rounds after the first one
    # bypass_retries: from this round onward negative scores and prompts are accepted
    max_retries: 3
    bypass_retries: 2
    
    # Rules are tiebreakers between actions with the same score:
    # the earlier a rule matches, the higher the priority of the action.
    # Actions are chosen by score first, then by rule priority, then at random.
    response_rules:
    - pocket(pocket_type::player_character)
    - pocket(pocket_type::player_table)
    - pocket(pocket_type::player_hand)
    - tag_value_not(tag_type::resolve, 1)
    - do_nothing
    
    in_play_rules:
    - tag_value(tag_type::strong)
    - equip
    - pocket(pocket_type::player_table)
    - pocket(pocket_type::player_hand)
    - pocket(pocket_type::player_character)
    - tag_value_not(tag_type::pass_turn)
  
